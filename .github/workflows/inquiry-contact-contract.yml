name: Inquiry contact contract

on:
  pull_request:
    paths:
      - 'src/components/inquiry-form.tsx'
      - 'src/app/api/inquiries/route.ts'
      - 'supabase/migrations/**'
      - 'tests/inquiry-contact-contract.test.mjs'
      - '.github/workflows/inquiry-contact-contract.yml'
  push:
    branches: ['fix/fwl-preferred-contact-20261102']
    paths:
      - 'src/components/inquiry-form.tsx'
      - 'src/app/api/inquiries/route.ts'
      - 'supabase/migrations/**'
      - 'tests/inquiry-contact-contract.test.mjs'
      - '.github/workflows/inquiry-contact-contract.yml'

permissions:
  contents: read

jobs:
  contact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify form/API/database contact contract
        run: node --test tests/inquiry-contact-contract.test.mjs
